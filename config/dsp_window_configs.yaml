# config/dsp_window_configs.yaml
# DSP windows per waveform length (samples per record). The dsp stage picks the
# entry matching the record length it measures from the data; a new record
# length needs a new entry before that run can be processed.
#   baseline_end  samples [0, baseline_end) give the baseline
#   total_end     charge window = [baseline_end, total_end)
#   prompt_width  samples from the charge-window start counted as prompt
#                 light for psd_param (hit stage)
#   prompt_end    = baseline_end + prompt_width (kept for reference)
5000:
  baseline_end: 450
  prompt_end: 730
  prompt_width: 280
  total_end: 4500
  notes: "May 20-21 setup (gas, liquid, solid). Prompt window = 280 samples from the charge-window start: pulse onset is ~30 samples in, so this is ~500 ns (250 samples at 2 ns) after onset, per advisor."

3000:
  baseline_end: 480
  prompt_end: 680
  prompt_width: 200
  total_end: 3000
  notes: "solid argon, run 1450pm. At 2 ns/sample the record covers 6 microseconds (about four triplet lifetimes). Truncation checked empirically: last 200 samples hold 0.31% of the charge_total window sum (see PIPELINE_OVERVIEW_PARQUET.md §7)."
